# Render.com Deployment Configuration
# FastAPI Backend + Uvicorn for FREE tier deployment

services:
  # FastAPI Backend Service
  - type: web
    name: loan-decision-api
    env: python
    region: oregon
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python pipeline/build_artifacts.py
      python pipeline/ingest_rag.py
    startCommand: |
      uvicorn api.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL  
        value: INFO
      - key: DEBUG
        value: false
      - key: GROQ_API_KEY
        sync: false  # Set in Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: loan-decision-api.onrender.com,localhost
      - key: CORS_ORIGINS
        value: https://your-streamlit-app.streamlit.app
      - key: CHROMA_PERSIST_DIRECTORY
        value: /opt/render/project/src/chroma_db
      - key: MODEL_CACHE_DIR
        value: /opt/render/project/src/models
      - key: DATA_CACHE_DIR
        value: /opt/render/project/src/data

  # Background Services (Optional - for cron jobs)
  # - type: cron
  #   name: model-updater
  #   env: python
  #   schedule: "0 2 * * *"  # Daily at 2 AM
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: python scripts/update_models.py